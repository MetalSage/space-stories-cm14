- type: entity
  id: APCControlReturnAction
  name: Stop controlling turret
  components:
  - type: InstantAction
    icon:
      sprite: Objects/Tools/crowbar.rsi
      state: icon
    event: !type:APCControlReturnActionEvent {}
    useDelay: 1

# Base
- type: entity
  parent: BaseStructureDynamic
  id: STAPCDoor
  name: APC door
  description: noe
  components:
  - type: Sprite
    noRot: true
    drawdepth: WallMountedItems
    sprite: _RMC14/Structures/Wallmounts/cmdcabinet.rsi
    layers:
    - state: closed
      map: ["enum.StorageVisualLayers.Base"]
  - type: Appearance
  - type: Transform
    noRot: true
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Anchorable
    flags:
    - None
  - type: MovedByPressure
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.48,0.25,0.48"
        density: 75
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: PlaceableSurface
    placeCentered: true
    isPlaceable: false
  - type: WallMount
    arc: 175
  - type: APCDoor
    side: Left

- type: entity
  id: APCVehicle
  components:
  - type: MobMover
  - type: DoAfter
  - type: InputMover
  - type: InteractionOutline
  - type: MovementSpeedModifier
    baseWalkSpeed: 0
    baseSprintSpeed: 0
    acceleration: 0
  - type: Physics
    bodyType: KinematicController
  - type: Clickable
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1,-1.5,1,2.5"
        density: 1000
        mask:
        - MobMask
        layer:
        - MobLayer
        - BulletImpassable
  - type: Appearance
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 450
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Breakage" ]
  - type: MobThresholds
    thresholds:
      0: Alive
      1000: Critical
  - type: MobState
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: _Stories/apc.rsi
    layers:
    - map: [ "enum.APCEntityVisualLayers.Base" ]
      state: apc_base
  - type: APCEntity
    baseState: apc_base
    destroyedState: apc_base
    startingModules:
    - APCDualCannon
  - type: ContainerContainer
    containers:
      actions: !type:Container
  - type: Actions
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: null
  - type: RequireProjectileTarget
  - type: UserInterface
    interfaces:
      enum.DialogUiKey.Key:
        type: DialogBui
  - type: AccessReader
    access: [ [ "CMAccessPilot" ] ]
  - type: NoRotateOnInteract
  - type: APCModulesHolderVisuals

- type: entity
  id: APCWheels
  components:
  - type: DoAfter
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Clickable
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1,-1.5,1,2.5"
        density: 100
        mask:
        - MobMask
        layer:
        - MobLayer
        hard: false
  - type: Appearance
  - type: MobThresholds
    thresholds:
      0: Alive
      1000: Critical
  - type: MobState
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: _Stories/apc.rsi
    state: wheels_1
  - type: Actions

- type: entity
  parent: RMCCommunicationsConsoleBase
  id: STAPCControlConsole
  name: apc control console
  description: State of the art machinery for giving orders to a squad.
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: _RMC14/Structures/Machines/computer.rsi
    state: overwatch
    overrideDir: West
    enableOverrideDir: true
  - type: InteractionOutline
  - type: ActivatableUI
    key: enum.APCControlWindowUI.Key
  - type: ActivatableUIRequiresAccess
  - type: AccessReader
    access: [ [ "CMAccessCommand" ] ]
  - type: UserInterface
    interfaces:
      enum.APCControlWindowUI.Key:
        type: APCControlBui
      enum.DialogUiKey.Key:
        type: DialogBui
  - type: APCController

- type: entity
  id: APCDualCannon
  name: dual cannon
  components:
    - type: Clickable
    - type: InteractionOutline
    - type: Actions
    - type: Physics
      bodyType: Dynamic
      canCollide: false
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.25,-0.25,0.25,0.25"
          density: 20
          mask:
          - MobMask
          layer:
          - BulletImpassable
          - MobLayer
          hard: false
    - type: ContainerContainer
      containers:
        ballistic-ammo: !type:Container
    - type: Sprite
      sprite: _Stories/apc.rsi
      drawdepth: Mobs
      noRot: true
      layers:
        - state: dualcannon_0
    - type: CombatMode
      toggleMouseRotator: false
    - type: Gun
      fireRate: 6
      selectedMode: FullAuto
      availableModes:
        - FullAuto
      soundGunshot: /Audio/_Stories/dual_autocannon_fire.ogg
    # TODO: Power ammo provider?
    - type: BallisticAmmoProvider
      proto: RMCCartridgeLMGM60
      capacity: 500
    - type: Input
      context: "human"
    - type: Appearance
    - type: NoRotateOnInteract
    - type: NoRotateOnMove
    - type: APCModule
      attachTime: 6
      moduleType: Weapon
    - type: APCModulesVisuals
    - type: Item

- type: entity
  id: APCWheelsWheels
  name: wheels
  components:
  - type: DoAfter
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Appearance
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: _Stories/apc.rsi
    state: wheels_0
  - type: Actions
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  parent: BaseItem
  id: APCWheelsItem
  description: A sheet of metal, used often on the station in various applications.
  components:
  - type: Sprite
    sprite: _Stories/apcitems.rsi
    state: tires_wy
  - type: Item
    size: Normal
  - type: StaticPrice
    price: 0
  - type: APCModule
    attachTime: 6
    moduleType: Movement
  - type: MovementSpeedModifier
    baseWalkSpeed: 6
    baseSprintSpeed: 6
    acceleration: 6
  - type: APCModulesVisuals
    rsi: _Stories/apc.rsi

- type: entity
  id: STAPCEnterPoint
  name: APC EnterPoint
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _RMC14/Areas/areas.rsi
    state: unknown
  - type: Marker
  - type: Clickable
  - type: InteractionOutline
  - type: APCEnterPoint
