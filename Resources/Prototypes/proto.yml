- type: entity
  id: STAPCHardpointMenuAction
  name: Hardpoints Menu
  description: Open hardpoints menu
  categories:
  - HideSpawnMenu
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    icon:
      sprite: _Stories/Actions/xeno_actions.rsi
      state: corrosive_acid
    event: !type:VehicleHardpointsMenuActionEvent

- type: entity
  parent: BaseStructureDynamic
  id: STAPCDoor
  name: APC door
  description: noe
  components:
  - type: Sprite
    noRot: true
    drawdepth: WallMountedItems
    sprite: _RMC14/Structures/Wallmounts/cmdcabinet.rsi
    layers:
    - state: closed
      map: ["enum.StorageVisualLayers.Base"]
  - type: Appearance
  - type: Transform
    noRot: true
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Anchorable
    flags:
    - None
  - type: MovedByPressure
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.48,0.25,0.48"
        density: 75
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: PlaceableSurface
    placeCentered: true
    isPlaceable: false
  - type: WallMount
    arc: 175

- type: entity
  id: APCVehicle
  components:
  - type: MobMover
  - type: DoAfter
  - type: InputMover
  - type: InteractionOutline
  - type: MovementSpeedModifier
    baseWalkSpeed: 1
    baseSprintSpeed: 1
    acceleration: 10
  - type: Physics
    bodyType: KinematicController
  - type: Clickable
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-2,-1.5,2,1.5"
        density: 1000
        mask:
          - Transport
        layer:
          - WallLayer
          - MobLayer
  - type: Appearance
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 450
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Breakage" ]
  - type: MobThresholds
    thresholds:
      0: Alive
      1000: Critical
  - type: MobState
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: _Stories/apc.rsi
    layers:
    - map: [ "enum.VehicleVisualLayers.Base" ]
      state: apc_base
  - type: ContainerContainer
    containers:
      actions: !type:Container
  - type: Actions
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: null
  - type: RequireProjectileTarget
  - type: UserInterface
    interfaces:
      enum.DialogUiKey.Key:
        type: DialogBui
      enum.VehicleAttachmentUI.StripKey:
        type: VehicleAttachmentStripBui
      enum.VehicleAttachmentUI.ChooseSlotKey:
        type: VehicleAttachmentChooseSlotBui
      enum.VehicleSelectHardpointUI.Key:
        type: VehicleSelectHardpointBui
        interactionRange: 0
        requireInputValidation: true
  - type: NoRotateOnInteract
  - type: Vehicle
    movementSlot: apc-slot-movement
    damageMults:
      Heat: 1.6
      Slash: 1
      Piercing: 0.6
      Blunt: 0.7
    health: 1000
    passengerSlots:
      current: 0
      max: 15
    revivableDeadSlots:
      current: 0
      max: 2
    xenoSlots:
      current: 0
      max: 8
  - type: ExplosionResistance
    DamageCoefficient: 0.7
    Worn: false
    Examine: "explosion-resistance-coefficient-value"
  - type: VehicleAttachableHolder
    slots:
      apc-slot-movement:
        startingAttachable:
        whitelist:
          tags:
          - RMCAttachmentExtendedBarrel
      apc-slot-maincannon:
        whitelist:
          tags:
          - Airlock
      apc-slot-frontalcannon:
        whitelist:
          tags:
          - APCMiniXyi
      apc-slot-supportcannon:
        whitelist:
          tags:
          - APCFlareLauncher
  - type: VehicleAttachableHolderVisuals
  - type: VehicleHardpointsMenu
  - type: NpcFactionMember
    factions:
    - UNMC

- type: entity
  parent: BaseItem
  id: APCDualCannonBase
  description: big black d....Gun
  components:
  - type: Sprite
    sprite: _Stories/apcitems.rsi
    layers:
    - map: [ "enum.VehicleAttachableVisualLayers.Base" ]
      state: dual_cannon
  - type: Item
    size: Normal
  - type: StaticPrice
    price: 0
  - type: VehicleAttachable
  - type: VehicleAttachableVisuals
    rsi: _Stories/apc.rsi
    state: dualcannon_0
  - type: Tag
    tags:
    - Airlock
  - type: VehicleMovementAttachable
#  - type: VehicleHardpointAttachable
  - type: NpcFactionMember
    factions:
    - UNMC
  - type: UserIFF
    faction: FactionMarine
  - type: NoRotateOnInteract
  - type: NoRotateOnMove
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Gun
    fireRate: 0.3
    selectedMode: FullAuto
    availableModes:
      - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/shotgun.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: BallisticVehicleAmmoProvider
    prototype: CartridgeCaselessRifle
    shots: 20
    capacity: 20
    ammoType: CartridgeCaselessRifle
  - type: VehicleGun
  - type: AmmoCounter
  - type: VehicleGunAttachable

