- type: entity
  id: STAPCHardpointMenuAction
  name: Hardpoints Menu
  description: Open hardpoints menu
  categories:
  - HideSpawnMenu
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    icon:
      sprite: _Stories/Actions/xeno_actions.rsi
      state: corrosive_acid
    event: !type:APCHardpointsMenuActionEvent

- type: entity
  parent: BaseStructureDynamic
  id: STAPCDoor
  name: APC door
  description: noe
  components:
  - type: Sprite
    noRot: true
    drawdepth: WallMountedItems
    sprite: _RMC14/Structures/Wallmounts/cmdcabinet.rsi
    layers:
    - state: closed
      map: ["enum.StorageVisualLayers.Base"]
  - type: Appearance
  - type: Transform
    noRot: true
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Anchorable
    flags:
    - None
  - type: MovedByPressure
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.48,0.25,0.48"
        density: 75
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: PlaceableSurface
    placeCentered: true
    isPlaceable: false
  - type: WallMount
    arc: 175

- type: entity
  id: APCVehicle
  components:
  - type: MobMover
  - type: DoAfter
  - type: InputMover
  - type: InteractionOutline
  - type: MovementSpeedModifier
    baseWalkSpeed: 1
    baseSprintSpeed: 1
    acceleration: 10
  - type: Physics
    bodyType: KinematicController
  - type: Clickable
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-2,-2,2,2"
        density: 1000
        mask:
          - MobMask
          - FullTileMask
          - Transport
        layer:
          - WallLayer
          - MobLayer
  - type: Appearance
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 450
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Breakage" ]
  - type: MobThresholds
    thresholds:
      0: Alive
      1000: Critical
  - type: MobState
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: _Stories/apc.rsi
    layers:
    - map: [ "enum.APCEntityVisualLayers.Base" ]
      state: apc_base
  - type: ContainerContainer
    containers:
      actions: !type:Container
  - type: Actions
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: null
  - type: RequireProjectileTarget
  - type: UserInterface
    interfaces:
      enum.DialogUiKey.Key:
        type: DialogBui
      enum.APCAttachmentUI.StripKey:
        type: APCAttachmentStripBui
      enum.APCAttachmentUI.ChooseSlotKey:
        type: APCAttachmentChooseSlotBui
      enum.APCSelectHardpointUI.Key:
        type: APCSelectHardpointBui
        interactionRange: 0
        requireInputValidation: true
  - type: NoRotateOnInteract
  - type: APCEntity
    movementSlot: apc-slot-movement
  - type: APCAttachableHolder
    slots:
      apc-slot-movement:
        startingAttachable:
        whitelist:
          tags:
          - RMCAttachmentExtendedBarrel
      apc-slot-hardpoints:
        whitelist:
          tags:
          - Airlock
  - type: APCAttachableHolderVisuals
  - type: APCHardpointsMenu

