- type: entity
  id: STAPCHardpointMenuAction
  name: Hardpoints Menu
  description: Open hardpoints menu
  categories:
  - HideSpawnMenu
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    icon:
      sprite: _Stories/Actions/xeno_actions.rsi
      state: corrosive_acid
    event: !type:VehicleHardpointsMenuActionEvent

- type: entity
  parent: BaseStructureDynamic
  id: STAPCDoor
  name: APC door
  description: noe
  components:
  - type: Sprite
    noRot: true
    drawdepth: WallMountedItems
    sprite: _RMC14/Structures/Wallmounts/cmdcabinet.rsi
    layers:
    - state: closed
      map: ["enum.StorageVisualLayers.Base"]
  - type: Appearance
  - type: Transform
    noRot: true
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Anchorable
    flags:
    - None
  - type: MovedByPressure
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.48,0.25,0.48"
        density: 75
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: PlaceableSurface
    placeCentered: true
    isPlaceable: false
  - type: WallMount
    arc: 175

- type: entity
  id: APCVehicle
  components:
  - type: MobMover
  - type: DoAfter
  - type: InputMover
  - type: InteractionOutline
  - type: MovementSpeedModifier
    baseWalkSpeed: 1
    baseSprintSpeed: 1
    acceleration: 10
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.15,-2,1.2,2"
        density: 1000
        mask:
        - Transport
        - LargeMobMask
        layer:
        - LargeMobLayer
  - type: Clickable
  - type: Appearance
  - type: MobState
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: _Stories/Mobs/Vehicles/base_apc.rsi
    layers:
    - map: [ "enum.VehicleVisualLayers.Base" ]
      state: apc_base
  - type: ContainerContainer
    containers:
      actions: !type:Container
  - type: Actions
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: null
  - type: RequireProjectileTarget
  - type: UserInterface
    interfaces:
      enum.DialogUiKey.Key:
        type: DialogBui
      enum.VehicleAttachmentUI.StripKey:
        type: VehicleAttachmentStripBui
      enum.VehicleAttachmentUI.ChooseSlotKey:
        type: VehicleAttachmentChooseSlotBui
      enum.VehicleSelectHardpointUI.Key:
        type: VehicleSelectHardpointBui
        interactionRange: 0
        requireInputValidation: true
  - type: NoRotateOnInteract
  - type: Vehicle
    gridPath: "/Maps/_Stories/hahahaa_apc_vehicle_pjb_lol_lmao_kekw_super_ultra_hd_btr_metalsage_1984_148F.yml"
    maxHealth: 1000
    movementSlot: vehicle-slot-treads
    damageMults:
      Heat: 1.6
      Slash: 1
      Piercing: 0.6
      Blunt: 0.7
    passengerSlots:
      current: 0
      max: 15
    revivableDeadSlots:
      current: 0
      max: 2
    xenoSlots:
      current: 0
      max: 8
#    roleReservedSlots:
#      - categoryName: "Crewmen"
#        roles:
#          - JOB_TANK_CREW
#          - JOB_WO_CREWMAN
#          - JOB_UPP_CREWMAN
#          - JOB_PMC_CREWMAN
#        total:
#          current: 0
#          max: 2
#      - categoryName: "Synthetic Unit"
#        roles:
#          - JOB_SYNTH
#          - JOB_WO_SYNTH
#        total:
#          current: 0
#          max: 1
  - type: ExplosionResistance
    DamageCoefficient: 0.7
    Worn: false
    Examine: "explosion-resistance-coefficient-value"
  - type: VehicleAttachableHolder
    slots:
      vehicle-slot-treads:
        startingAttachable: STMarineVehicleWheelsBase
        hardpointType: HDPT_TREADS
      vehicle-slot-support:
        startingAttachable: STMarineVehicleFlareLauncher
        hardpointType: HDPT_SUPPORT
      vehicle-slot-secondary:
        startingAttachable: STMarineVehicleFrontalCannon
        hardpointType: HDPT_SECONDARY
      vehicle-slot-primary:
        startingAttachable: STMarineVehicleDualcannon
        hardpointType: HDPT_PRIMARY
  - type: VehicleAttachableHolderVisuals
    rsi: _Stories/Mobs/Vehicles/base_apc.rsi
    damagedState: damaged_frame
  - type: VehicleHardpointsMenu
  - type: NpcFactionMember
    factions:
    - UNMC
  - type: AccessReader
    access: [["CMAccessBrig"],["CMAccessCommand"]]
#   - ACCESS_MARINE_CREWMAN
  - type: UserIFF
    faction: FactionMarine

