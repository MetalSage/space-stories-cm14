- type: hardpointType
  id: HDPT_ARMOR
  repairPerSecond: 0.014  # 1.4% в секунду
  attachDelay: 30 # num_delay * 3

- type: hardpointType
  id: HDPT_PRIMARY
  repairPerSecond: 0.02  # 2% в секунду
  attachDelay: 5 # num_delay * 3

- type: hardpointType
  id: HDPT_SECONDARY
  repairPerSecond: 0.025  # 2.5% в секунду
  attachDelay: 9 # num_delay * 3

- type: hardpointType
  id: HDPT_SUPPORT
  repairPerSecond: 0.025  # 2.5% в секунду
  attachDelay: 6 # num_delay * 3

- type: hardpointType
  id: HDPT_TREADS
  repairPerSecond: 0.033  # 3.3% в секунду
  attachDelay: 7 # num_delay * 3


