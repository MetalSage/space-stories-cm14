- type: job
  parent: STSyntheticColony
  id: STSyntheticColonyHybrisaExecBodyguard
  startingGear: STGearSyntheticColonistHybrisaExecBodyguard
  spawnMenuRoleName: Executive Bodyguard Synth (Hybrisa Survivor)
  special:
  - !type:AddComponentSpecial
    components:
    - type: Language
      spokenLanguages:
      - English
      - French
      - Japanese
      - Russian
      - German
      - Chinese
      - Spanish
      - Xeno
      understoodLanguages:
      - English
      - French
      - Japanese
      - Russian
      - German
      - Chinese
      - Spanish
      - Xeno
      currentLanguage: English
      defaultLanguage: English
    - type: DemoSpecWhitelist
    - type: GrenadeSpecWhitelist
    - type: ScoutWhitelist
    - type: SniperWhitelist
    - type: PyroWhitelist
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: synth
    - type: NpcFactionMember
      factions:
      - Civilian
    - type: IntelRescueSurvivorObjective
    - type: RMCSurvivor
    - type: MotionDetectorTracked
    - type: MeleeWeapon
      soundHit:
        path: /Audio/_RMC14/Weapons/synthpunch1.ogg
        params:
          variation: 0.15
          volume: -1
      angle: 30
      animation: WeaponArcFist
      attackRate: 1
      damage:
        types:
          Blunt: 35
    - type: EquipSurvivorPreset
      preset: STSurvivorPresetHybrisaSynthExecBodyguard
    - type: Synth
    - type: SynthGeneration
      generation: STSynthGenTwo
      selectable: false
  useLoadoutOfJob: STSyntheticColony

- type: startingGear
  parent: STGearSyntheticColonistBase
  id: STGearSyntheticColonistHybrisaExecBodyguard
  equipment:
    outerClothing: RMCHazardVestBlack
  inhand:
    - RMCScabbardMacheteFilled

- type: entity
  id: STSurvivorPresetHybrisaSynthExecBodyguard
  name: survivor synth hybrisa executive bodyguard preset
  categories: [ HideSpawnMenu ]
  components:
  - type: EntityPreset
    randomOutfits:
    - [ RMCJumpsuitLiaisonExpensiveSuitDropPouch, RMCSatchelBlack, RMCBootsCorporate ]
    - [ RMCJumpsuitLiaisonExpensiveSuitBrownDropPouch, RMCSatchelBlack, CMBootsBrownFilled ]
    - [ RMCJumpsuitLiaisonExpensiveSuitJacketDropPouch, CMSatchelSecureStandard, RMCBootsPMCFilled ]
    - [ RMCJumpsuitLiaisonExpensiveSuitBrownJacketDropPouch, CMSatchelSecureStandard, RMCBootsCorporate ]
    - [ RMCJumpsuitLiaisonExpensiveSuitJacketOnlyDropPouch, RMCSatchelNorm, RMCBootsCorporate ]
    randomStartingGear:
      eyes:
      - CMGlassesSecurity
      - RMCGlassesSecurityBlue
