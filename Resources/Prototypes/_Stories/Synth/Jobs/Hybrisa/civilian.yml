- type: job
  parent: STSyntheticColony
  id: STSyntheticColonyHybrisaCivilian
  startingGear: STGearSyntheticColonistHybrisaCivilian
  spawnMenuRoleName: Civilian Synth (Hybrisa Survivor)
  special:
  - !type:AddComponentSpecial
    components:
    - type: Language
      preset: STLanguagePresetSynthColonist
    - type: LanguageLearning
      preset: STLanguageLearningPresetSynthColonist
    - type: RMCAllowSuitStorage
    - type: DemoSpecWhitelist
    - type: GrenadeSpecWhitelist
    - type: ScoutWhitelist
    - type: SniperWhitelist
    - type: PyroWhitelist
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: synth
    - type: NpcFactionMember
      factions:
      - Civilian
    - type: IntelRescueSurvivorObjective
    - type: RMCSurvivor
    - type: MotionDetectorTracked
    - type: MeleeWeapon
      soundHit:
        path: /Audio/_RMC14/Weapons/synthpunch1.ogg
        params:
          variation: 0.15
          volume: -1
      angle: 30
      animation: WeaponArcFist
      attackRate: 1
      damage:
        types:
          Blunt: 35
    - type: EquipSurvivorPreset
      preset: STSurvivorPresetHybrisaSynthCivilian
    - type: Synth
    - type: SynthGeneration
      generation: STSynthGenTwo
      selectable: false
  useLoadoutOfJob: STSyntheticColony

- type: startingGear
  parent: STGearSyntheticColonistBase
  id: STGearSyntheticColonistHybrisaCivilian
  inhand:
    - RMCFireAxe

- type: entity
  id: STSurvivorPresetHybrisaSynthCivilian
  name: survivor synth hybrisa civilian colonist preset
  categories: [ HideSpawnMenu ]
  components:
  - type: EntityPreset
    randomOutfits:
    - [ RMCHeadCapWeyamart, RMCJumpsuitWeyamart, RMCHazardVestWeyamart, CMSatchel, RMCShoesLaceup ]
    - [ RMCHazardVestGreen, CMHandsBrown, RMCJumpsuitSanitation, CMSatchelEngineer, CMBootsBrown ]
    - [ RMCHeadCapPizzaGalaxy, RMCJumpsuitPizzaGalaxy, RMCSatchelNorm, RMCBoxPizzaGalaxyMystery, RMCShoesRed ]
    - [ RMCHeadCapCargo, RMCJumpsuitCivilian, RMCHazardVestYellow, RMCHandsCombat, RMCShoesCombat, RMCSatchelLightpack, RMCAttachmentUnderbarrelExtinguisher ]
    - [ RMCDailyGrindApron, RMCJumpsuitDailyGrind, RMCShoesLaceup, CMSatchel ]
    - [ RMCJumpsuitCivilianYellow, RMCHeadCapFlippable, RMCSatchelNorm, CMBootsBlackFilled, CMPackFlare, RMCHazardVest, RMCBinoculars, RMCBeltUtilityGeneral, RMCHandsVeteran, RMCScabbardMacheteFilled, RMCEarmuffs ]
    - [ RMCHipsterGlasses, RMCJumpsuitCivilianBrown, RMCSatchelNorm, CMSparePDTLBattleBuddyKit, RMCCoatBomber, CMHealthAnalyzer, RMCSprayBottleSpaceCleaner, RMCCrayonBox, RMCFoodSnackChipsPepper, CMBootsBlackFilled ]
