- type: job
  parent: STSyntheticColony
  id: STSyntheticColonyHybrisaXenoarch
  startingGear: STGearSyntheticColonistHybrisaXenoarch
  spawnMenuRoleName: Xenoarchaeologist Synthetic (Hybrisa Survivor)
  special:
  - !type:AddComponentSpecial
    components:
    - type: Language
      preset: STLanguagePresetSynthColonist
    - type: LanguageLearning
      preset: STLanguageLearningPresetSynthColonist
    - type: RMCAllowSuitStorage
    - type: DemoSpecWhitelist
    - type: GrenadeSpecWhitelist
    - type: ScoutWhitelist
    - type: SniperWhitelist
    - type: PyroWhitelist
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: synth
    - type: NpcFactionMember
      factions:
      - Civilian
    - type: IntelRescueSurvivorObjective
    - type: RMCSurvivor
    - type: MotionDetectorTracked
    - type: MeleeWeapon
      soundHit:
        path: /Audio/_RMC14/Weapons/synthpunch1.ogg
        params:
          variation: 0.15
          volume: -1
      angle: 30
      animation: WeaponArcFist
      attackRate: 1
      damage:
        types:
          Blunt: 35
    - type: EquipSurvivorPreset
      preset: STSurvivorPresetHybrisaSynthXenoarch
    - type: Synth
    - type: SynthGeneration
      generation: STSynthGenTwo
      selectable: false
  useLoadoutOfJob: STSyntheticColony

- type: startingGear
  parent: STGearSyntheticColonistBase
  id: STGearSyntheticColonistHybrisaXenoarch
  equipment:
    jumpsuit: RMCJumpsuitCivilianScientist
    back: CMSatchelMedical
    shoes: RMCShoesWhite

- type: entity
  id: STSurvivorPresetHybrisaSynthXenoarch
  name: survivor synth hybrisa Xenoarch preset
  categories: [ HideSpawnMenu ]
  components:
  - type: EntityPreset
    randomOutfits:
    - [ CMSatchel, RMCLabcoatScience, RMCShoesBrown ]
    - [ RMCSatchelLightpack, RMCSuitBioWeYa, RMCHoodBioWeYa, RMCShoesBrown, RMCGlassesReagentHUDGlasses ]
    - [ RMCSatchelLightpack, RMCSuitBioWeYa, RMCHoodBioWeYa, CMHandsBrown, RMCShoesBrown, RMCGlassesReagentHUDGlasses ]
    - [ RMCSatchelLightpack, RMCSuitBioWeYa, RMCHoodBioWeYa, RMCHandsVeteranCBRN, RMCBootsCBRN, RMCGlassesReagentHUDGlasses, RMCExplosivePlastic ]
    randomGearOther:
    -
      - [ RMCToolSpade, RMCFlashlightLantern ]
