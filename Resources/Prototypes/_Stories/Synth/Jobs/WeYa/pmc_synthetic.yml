- type: job
  parent: CMJobBase
  id: STPMCSynthetic
  name: st-job-name-pmc-synth
  description: st-job-description-pmc-synth
  playTimeTracker: STJobPMCSynthetic
  ranks:
    STRankWeYaPMCSynthetic: [ ]
  startingGear: STGearPMCSynthetic
  icon: "STJobIconPMCSynthetic"
  joinNotifyCrew: false
  accessGroups:
  - RMCWeYa
  spawnMenuRoleName: WEYA PMC Synthetic
  special:
  - !type:AddComponentSpecial
    components:
    - type: NpcFactionMember
      factions:
      - WeYa
    - type: Language
      spokenLanguages:
      - English
      - French
      - Japanese
      - Russian
      - Scandinavian
      - German
      - Chinese
      - Spanish
      understoodLanguages:
      - English
      - French
      - Japanese
      - Russian
      - Scandinavian
      - German
      - Chinese
      - Spanish
      currentLanguage: English
      defaultLanguage: English
    - type: LanguageLearning
      learnableLanguages:
      - Xeno
      firstContactLanguages:
      - Xeno
      comprehensionThreshold: 0.8
      learningRange: 8.0
      baseWordLearningRate: 0.05
    - type: JobPrefix
      prefix: st-job-prefix-pmc-synth
    - type: RMCTrackable
    - type: MeleeWeapon
      soundHit:
        path: /Audio/_RMC14/Weapons/synthpunch1.ogg
        params:
          variation: 0.15
          volume: -1
      angle: 30
      animation: WeaponArcFist
      attackRate: 1
      damage:
        types:
          Blunt: 35
    - type: Synth
    - type: AssignSquad
      whitelist:
        tags:
        - RMCSquadPMC
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: pmc_syn
      background:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: background_pmc
  hidden: true

- type: startingGear
  id: STGearPMCSynthetic
  equipment:
    head: ArmorHelmetPMCOfficer
    ears: RMCHeadsetDistressPMC
    eyes: RMCGlassesExperimentalMeson
    back: STPMCSyntheticSmartpack
    belt: RMCBeltMedicBagPMCFilled
    suitstorage: STMaintenanceJack
    jumpsuit: STJumpsuitVeteranPMCSynth
    outerClothing: RMCArmorM4PMCSynthFilled
    shoes: RMCBootsPMCFilled
    id: CMIDCardPMC
    pocket1: STPouchToolsSocFilledSynthetic
    pocket2: RMCPouchConstructionFillLowGrade
  storage:
    back:
    - RMCUniversalRecorder
    - STSynthResetKey

- type: playTimeTracker
  id: STJobPMCSynthetic
