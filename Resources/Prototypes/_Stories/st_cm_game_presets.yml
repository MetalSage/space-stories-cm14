- type: gamePreset
  id: STDistressSignal
  alias:
  - stdistresssignal
  - stcmds
  name: rmc-distress-signal-title
  description: rmc-distress-signal-description
  showInVote: false
  minPlayers: 51
  # The first preset whose player requirements match is selected when the round starts.
  roundStartResolvePresets:
  - STDistressSignal
  - STDistressSignalLowPop
  rules:
  - CMDistressSignal

- type: gamePreset
  id: STDistressSignalLowPop
  alias:
  - stdistresssignallowpop
  - stdslowpop
  - stlowpop
  name: rmc-distress-signal-title
  description: rmc-distress-signal-description
  showInVote: false
  maxPlayers: 50
  # Do not auto-pick the low pop variant in the first lobby after a server restart.
  ignoreOnFirstRoundAfterRestart: true
  rules:
  - STDistressSignalLowPop
