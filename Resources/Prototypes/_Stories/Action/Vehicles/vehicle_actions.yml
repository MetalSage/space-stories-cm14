- type: entity
  id: STVehicleSelectHardpointAction
  name: Select Hardpoint
  description: Open hardpoints menu
  categories:
  - HideSpawnMenu
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _Stories/Actions/vehicle_actions.rsi
      state: chamber_swap
    useDelay: 1
  - type: InstantAction
    event: !type:VehicleSelectHardpointEvent

