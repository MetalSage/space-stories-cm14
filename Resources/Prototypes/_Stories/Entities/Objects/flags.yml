- type: entity
  abstract: true
  parent: CMBaseStructureCorrodible
  id: CMPlasedFlagBase
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Rotatable
  - type: Appearance
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.44,-0.99,-0.23,-0.89"
        density: 100
        mask:
        - FullTileMask
        layer:
        - TableLayer
        - LowImpassable
        - BarricadeImpassable
  - type: RotationDrawDepth
    southDrawDepth: OverMobs
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: CMBarricade
  - type: RMCDropshipBlocked
  - type: GenericVisualizer
    visuals:
      enum.SprayAcidedVisuals.Acided:
        acided:
          True:
            sprite: _RMC14/Effects/xeno_spray_acid.rsi
            state: acid
            visible: true
          False:
            visible: false
  - type: DamageMultiplierFlags
    flags: Breaching

- type: entity
  parent: CMPlasedFlagBase
  id: AlphaFlag
  name: flag
  description: flag
  components:
  - type: Sprite
    sprite: _Stories/Structures/Flags/alpha.rsi
    layers:
      - state: base
      - map: [ "acided" ]
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: CMSandbag
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: CMPickupFlag
    item: "CMAlphaFlag"


