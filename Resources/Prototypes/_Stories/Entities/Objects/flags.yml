- type: entity
  abstract: true
  parent: BaseKnife
  id: CMBaseFlag
  components:
  - type: Clothing
    slots:
    - Back
  - type: Sprite
    sprite: _Stories/Objects/Flags/alpha.rsi
    state: icon
  - type: Item
    size: Huge
    sprite: _Stories/Objects/Flags/alpha.rsi

