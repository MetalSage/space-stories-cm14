- type: entity
  parent: RMCWeaponShotgunXM51
  name: ent-STWeaponShotgunXM52
  id: STWeaponShotgunXM52
  suffix: Stories, Breacher
  components:
  - type: Sprite
    sprite: _Stories/Objects/Weapons/Guns/Breacher/breacher_xm52.rsi
    layers:
    - state: bolt-open
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _Stories/Objects/Weapons/Guns/Breacher/breacher_xm52.rsi
  - type: Gun
    burstCooldown: 1.5
    shotsPerBurst: 2
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    - Burst
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_shotgun_xm51.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - Burst
    recoilWielded: 2
    recoilUnwielded: 4
    scatterWielded: 10
    scatterUnwielded: 30
    baseFireRate: 0.625
    burstFireRateMultiplier: 25
    modifiers:
      Burst:
        fireDelay: 0.1665
        maxScatterModifier: 10
        useBurstScatterMult: true
        unwieldedScatterMultiplier: 2
        shotsToMaxScatter: 6
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: STMagazineShotgunXM52
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_unload.ogg
        priority: 2
        whitelist:
          tags:
          - STMagazineShotgunXM52
  # No AttachableHolder slots at all -- the XM52's receiver is welded shut, no attachments possible.
  - type: AttachableHolder
    slots: { }
  - type: GunUserWhitelist
    whitelist:
      components:
      - BreacherWhitelist
  - type: GunRequiresSkills
    skills:
      RMCSkillSpecialistWeapons: 1
  - type: Tag
    tags:
    - RMCWeaponShotgun
    - RMCWeaponShotgunXM51
    - STWeaponShotgunXM52

- type: Tag
  id: STWeaponShotgunXM52
