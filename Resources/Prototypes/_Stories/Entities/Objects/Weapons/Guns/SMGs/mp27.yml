- type: entity
  parent: CMBaseCartridgeRifle
  id: CMCartridgeSMG4.6x30mm
  name: cartridge (4.6x30mm)
  description: A 4.6x30mm cartridge. Fits in 4.6x30mm magazines.
  components:
  - type: Tag
    tags:
    - Cartridge
    - CMCartridgeSMGMP27
  - type: CartridgeAmmo
    proto: BulletSMG4.6x30mm

- type: entity
  parent: BaseBullet
  id: BulletSMG4.6x30mm
  noSpawn: true
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 40
  - type: RMCProjectileDamageFalloff
    thresholds:
    - range: 22
      falloff: 9999
      ignoreModifiers: true
    - range: 10
      falloff: 5
  - type: CMArmorPiercing
    amount: 0

- type: Tag
  id: CMMagazineSMGMP27

- type: Tag
  id: CMCartridgeSMGMP27
