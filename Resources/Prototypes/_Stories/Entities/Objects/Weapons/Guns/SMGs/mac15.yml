- type: entity
  parent: CMBaseWeaponSMG
  name: MAC - 15 Machine pistol
  id: WeaponSMGMAC15
  description: It is a standart issue for CLF
  components:
  - type: Sprite
    sprite: _Stories/Objects/Weapons/Guns/SMG/mac15.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _Stories/Objects/Weapons/Guns/SMG/mac15.rsi
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: Gun
    selectedMode: FullAuto
    availableModes:
    - SemiAuto
    - FullAuto
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_m63.ogg #?
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - FullAuto
    recoilWielded: 0.1
    recoilUnwielded: 1
    scatterWielded: 11
    scatterUnwielded: 10
    baseFireRate: 10
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_unload.ogg
        priority: 2
        whitelist:
          tags:
          - CMMagazinePistolMAC15
          - CMMagazinePistolMAC15Ext  
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentSuppressor
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentS6ReflexSight
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentLaserSight
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.685, 0.127 #???
      rmc-aslot-rail: 0.03, 0.198 #???
      rmc-aslot-underbarrel: 0.28, -0.19 #???

- type: entity
  parent: BaseMagazineRifle
  id: CMMagazinePistolMAC15
  name: "MAC15 magazine(9mm)"
  components:
  - type: Tag
    tags:
    - CMMagazinePistol
    - CMMagazinePistolMAC15
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - CMCartridgePistol9mm
    proto: CMCartridgePistol9mm
    capacity: 32
  - type: Sprite
    sprite: _Stories/Objects/Weapons/Guns/Ammunition/Magazines/mac15.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Appearance

- type: entity
  parent: BaseMagazineRifle
  id: CMMagazinePistolMAC15Ext
  name: "MAC15 extended magazine(9mm)"
  components:
  - type: Tag
    tags:
    - CMMagazinePistol
    - CMMagazinePistolMAC15Ext
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - CMCartridgePistol9mm
    proto: CMCartridgePistol9mm
    capacity: 50
  - type: Sprite
    sprite: _Stories/Objects/Weapons/Guns/Ammunition/Magazines/mac15ext.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Appearance

- type: Tag
  id: CMMagazinePistolMAC15Ext

- type: Tag
  id: CMMagazinePistolMAC15
