- type: entity
  parent: CMMagazineRifleBase
  id: CMMagazineRifleMAR40
  name: "MAR magazine (7.62x39mm)"
  components:
  - type: Tag
    tags:
    - CMMagazineRifle
    - CMMagazineRifleMAR
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - CMCartridgeRifle7.62x39mm
    proto: CMCartridgeRifle7.62x39mm
    capacity: 40
  - type: Sprite
    sprite: _Stories/Objects/Weapons/Guns/Ammunition/Magazines/mar40.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Appearance

- type: entity
  parent: CMMagazineRifleMAR40
  id: CMMagazineRifleMAR50Drum
  name: "MAR-50 drum magazine (7.62x39mm)"
  components:
  - type: Tag
    tags:
    - CMMagazineRifle
    - CMMagazineRifleMAR50
  - type: BallisticAmmoProvider
    capacity: 100
  - type: Sprite
    sprite: _Stories/Objects/Weapons/Guns/Ammunition/Magazines/mar50.rsi

- type: entity
  parent: CMMagazineRifleMAR40
  id: CMMagazineRifleMAR40Ext
  name: "M54C extended magazine (10x24mm)"
  components:
  - type: Tag
    tags:
    - CMMagazineRifle
    - CMMagazineRifleMARExt
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - CMCartridgeRifle7.62x39mm
    proto: CMCartridgeRifle7.62x39mm
    capacity: 60
  - type: Sprite
    sprite: _Stories/Objects/Weapons/Guns/Ammunition/Magazines/mar40ext.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
