- type: entity
  parent: CMBaseWeaponRifle
  name: MAR-50 Light machine Gun
  id: WeaponRifleMAR50
  description: A cheap, reliable LMG chambered in 7.62x39mm. Commonly found in the hands of slightly better funded criminals.
  components:
  - type: Sprite
    sprite: _Stories/Objects/Weapons/Guns/Rifles/mar50.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _Stories/Objects/Weapons/Guns/Rifles/mar50.rsi
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: Gun
    selectedMode: FullAuto
    availableModes:
    - SemiAuto
    - Burst
    - FullAuto
    soundGunshot:
      collection: CMM54CShoot #replace?
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - Burst
    - FullAuto
    recoilWielded: 1
    scatterWielded: 3
    baseFireRate: 4
    burstScatterMult: 3
    burstAmount: 5
  - type: GunRequiresWield
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_unload.ogg
        priority: 2
        whitelist:
          tags:
          - CMMagazineRifleMAR
          - CMMagazineRifleMARExt
          - CMMagazineRifleMAR50
  - type: AttachableHolder
    slots:
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS6ReflexSight
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentBipod
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-rail: 0.10, 0.118 
      rmc-aslot-underbarrel: 0.25, -0.343

- type: entity
  parent: CMBaseWeaponRifle
  name: MAR-40 Light battle rifle
  id: WeaponRifleMAR40
  description: While outdated and old, this weapon has historically proven to be extremely reliable and adaptable. It has a magazine size of 40 7.62x39mm heavy rifle rounds, and burst fire capabilities. Originally created by the UPP as a quickly deployable rifle in any type of environment. It gained a positive reputation among poorer mercenary and planetary militia groups due to its reliability and ease of manufacturing and maintenance. It is one of the standard rifles for the Freelancer Mercenaries and the Colonial Liberation Front.
  components:
  - type: Sprite
    sprite: _Stories/Objects/Weapons/Guns/Rifles/mar40.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _Stories/Objects/Weapons/Guns/Rifles/mar40.rsi
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: Gun
    selectedMode: FullAuto
    availableModes:
    - SemiAuto
    - Burst
    - FullAuto
    soundGunshot:
      collection: CMM54CShoot #replace?
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - Burst
    - FullAuto
    recoilWielded: 1
    recoilUnwielded: 4
    scatterWielded: 6
    scatterUnwielded: 11
    baseFireRate: 2.5
    burstFireRate: 3.33
    burstScatterMult: 3
    burstAmount: 4
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_unload.ogg
        priority: 2
        whitelist:
          tags:
          - CMMagazineRifleMAR
          - CMMagazineRifleMARExt
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentBarrelCharger
          - RMCAttachmentExtendedBarrel
          - RMCAttachmentSuppressor
          - RMCM5Bayonet
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS6ReflexSight
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentBipod
          - RMCAttachmentGyroscopicStabilizer
          - RMCAttachmentU1GrenadeLauncher 
          - RMCAttachmentU7UnderbarrelShotgun
          - RMCAttachmentBurstFireAssembly
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.81, -0.031
      rmc-aslot-rail: 0.18, 0.118 
      rmc-aslot-underbarrel: 0.25, -0.343

