- type: entity
  parent: CMBaseCartridgeRifle
  id: CMCartridgeRifle7.62x39mm
  name: cartridge (7.62x39mm)
  description: A 7.62x39mm cartridge. Fits in 7.62x39mm magazines.
  components:
  - type: Tag
    tags:
    - Cartridge
    - CMCartridgeRifle7.62x39mm
  - type: CartridgeAmmo
    proto: BulletRifle7.62x39mm

- type: entity
  parent: BaseBullet
  id: BulletRifle7.62x39mm
  noSpawn: true
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 55
  - type: RMCProjectileDamageFalloff
    thresholds:
    - range: 22
      falloff: 9999
      ignoreModifiers: true
    - range: 7
      falloff: 4
  - type: CMArmorPiercing
    amount: 5

