- type: entity
  abstract: true
  parent: [ CMBaseWeaponGun, BaseItem, RMCBaseWeaponGunMagazineProvider, RMCBaseAttachableHolder ]
  id: StoriesWeaponRX47Base
  components:
  - type: Item
    size: Huge
  - type: Clothing
    slots: NONE
  - type: AmmoCounter
  - type: GunIFF
    enabled: true
  - type: GunPointBlank
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
      rx47_flamer_tank: !type:ContainerSlot
  - type: MagazineAmmoProvider
    autoEject: false
  - type: RMCAmmoEject
  - type: Appearance
  - type: GunSkilledRecoil
    setRecoil: 0
    mustBeWielded: false
    skills:
      RMCSkillFirearms: 0

- type: entity
  parent: StoriesWeaponRX47Base
  id: StoriesWeaponRX47Chaingun
  name: RX47 arm-mounted chaingun
  description: A mechsuit-mounted 20x102mm chaingun with an integrated IFF feed.
  components:
  - type: CombatMechWeapon
    armState: chaingun
    firingArc: 160
  - type: Sprite
    sprite: _Stories/Objects/Weapons/Guns/RX47/mech_guns.rsi
    layers:
    - state: chaingun
  - type: Gun
    cameraRecoilScalar: 0
    # Tuned to fire from the RX47 shoulder instead of above the sprite.
    shootOriginOffset: 0, -0.65
    fireRate: 8.33
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_m60.ogg
      params:
        volume: -2
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: WieldedCrosshair
    rsi:
      sprite: _RMC14/Interface/MousePointer/lmg_mouse.rsi
      state: all
  - type: RMCSelectiveFire
    baseFireModes:
    - FullAuto
    recoilWielded: 0
    recoilUnwielded: 0
    scatterWielded: 8
    scatterUnwielded: 8
    baseFireRate: 8.33
    modifiers:
      FullAuto:
        fireDelay: 0
        maxScatterModifier: 6
        useBurstScatterMult: true
        unwieldedScatterMultiplier: 1
        shotsToMaxScatter: 20
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        locked: true
        startingItem: StoriesMagazineRX47Chaingun
        priority: 2
        whitelist:
          tags:
          - StoriesMagazineRX47Chaingun

- type: entity
  parent: StoriesWeaponRX47Base
  id: StoriesWeaponRX47Siegebreaker
  name: RX47 siegebreaker cannon
  description: A 50mm mechsuit cannon with a narrow firing arc and explosive impact.
  components:
  - type: CombatMechWeapon
    armState: cannon
    firingArc: 90
  - type: Sprite
    sprite: _Stories/Objects/Weapons/Guns/RX47/mech_guns.rsi
    layers:
    - state: siegebreaker
  - type: Gun
    cameraRecoilScalar: 0
    # Tuned to fire from the RX47 shoulder instead of above the sprite.
    shootOriginOffset: 0, -0.65
    fireRate: 0.4
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_sniper.ogg
      params:
        volume: 2
  - type: WieldedCrosshair
    rsi:
      sprite: _RMC14/Interface/MousePointer/explosive_mouse.rsi
      state: all
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        locked: true
        startingItem: StoriesMagazineRX47Siegebreaker
        priority: 2
        whitelist:
          tags:
          - StoriesMagazineRX47Siegebreaker

