# =========================
# CARTRIDGES
# =========================
- type: entity
  id: CartridgeSharpExplosive
  parent: BaseCartridge
  name: deactivated SHARP mine (explosive)
  components:
  - type: Tag
    tags:
    - Cartridge
    - SharpCartridgeExplosive
  - type: Sprite
    sprite: _Stories/Objects/Weapons/Guns/Projectiles/Sharp/Mines/explosive.rsi
    state: disarmed
  - type: CartridgeAmmo
    proto: BulletSharpStickyExplosive
    deleteOnSpawn: true

