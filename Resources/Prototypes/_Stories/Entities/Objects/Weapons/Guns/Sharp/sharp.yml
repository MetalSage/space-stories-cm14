# =========================
# STICKY DARTS
# =========================
- type: entity
  id: BulletSharpStickyExplosive
  parent: BaseBullet
  name: sticky explosive dart
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Stories/Objects/Weapons/Guns/Projectiles/Sharp/explosive.rsi
    drawdepth: Overlays
    layers: [ { state: explosive_dart } ]

  - type: IgnoreArc

  - type: EmbeddableProjectile
    sound: /Audio/Weapons/pop.ogg
    embedOnThrow: false
    deleteOnRemove: false
    removalTime: null
    whitelist:
     components:
     - MobState

  - type: Projectile
    deleteOnCollide: false
    onlyCollideWhenShot: true
    maxFixedRange: 8
    impactEffect: BulletImpactEffect
    damage:
      types:
        Piercing: 35
  - type: IgnorePredictionHide

  - type: SharpStickyDart
    mineProto: SharpMineExplosiveL1
    iffDropProto: CartridgeSharpExplosive
    shortDelay: 2.5
    longDelay: 5.0

  - type: Explosive
    explosionType: RMC
    maxIntensity: 20
    intensitySlope: 6
    totalIntensity: 200
    canCreateVacuum: false

  - type: Fixtures
    fixtures:
      projectile:
        hard: false
        shape: !type:PhysShapeAabb
          bounds: "-0.15,-0.15,0.15,0.15"
        mask:
        - Impassable
        - BulletImpassable

- type: entity
  id: BulletSharpStickyIncendiary
  parent: BulletSharpStickyExplosive
  name: sticky incendiary dart
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Stories/Objects/Weapons/Guns/Projectiles/Sharp/incendiary.rsi
    drawdepth: Overlays
    layers: [ { state: incendiary_dart } ]


  - type: SharpStickyDart
    mineProto: SharpMineIncendiaryL1
    iffDropProto: CartridgeSharpIncendiary
    shortDelay: 2.5
    longDelay: 5.0

  - type: TileFireOnTrigger
    spawn: SharpTileFireL1
    range: 3
    intensity: 15
    duration: 12
    sound:
      path: /Audio/_RMC14/Weapons/Guns/Flamer/gun_flamethrower2.ogg

