  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
    zeroOnlyOnEmpty: true
  - type: Appearance

- type: entity
  id: MagazineSharpRifleFlechette
  name: 9X-F flechette dart magazine
  parent: BaseItem
