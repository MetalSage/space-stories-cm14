- type: entity
  id: SharpMineBase
  abstract: true
  name: SHARP mine
  description: A rapidly-deploying SHARP mine.
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
    fixedRotation: false
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        hard: false
        mask:
        - BulletImpassable
        - XenoProjectileImpassable
        layer:
        - BulletImpassable
        - XenoProjectileImpassable
  - type: Damageable
    damageContainer: Inorganic
  - type: GenericVisualizer
    visuals:
      enum.Trigger.TriggerVisuals.VisualState:
        enum.ConstructionVisuals.Layer:
          Primed: { state: primed }
          Unprimed: { state: icon }
  - type: SharpMine
    ignoreAnyIff: true
    triggerRadius: 1.0
    levelUpInterval: 75
    maxLifespan: 300
    level: 1

