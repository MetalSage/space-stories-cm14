- type: entity
  parent: STMarineVehicleAttachableBase
  name: ARS-159 Boyars Dualcannon
  id: STMarineVehicleDualcannon
  description: none
  components:
  - type: Sprite
    sprite: _Stories/Objects/Vehicles/base_apc_items.rsi
    layers:
    - map: [ "enum.VehicleAttachableVisualLayers.Base" ]
      state: dual_cannon
  - type: VehicleAttachable
    hardpointType: HDPT_PRIMARY
    damageMult: 0.2
    skill: RMCSkillEngineer
    level: 2
    maxHealth: 500
  - type: VehicleAttachableVisuals
    rsi: _Stories/Mobs/Vehicles/base_apc.rsi
    state: dualcannon
    destroyedState: dualcannon_destroyed
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Gun
    fireRate: 0.3
    selectedMode: FullAuto
    availableModes:
      - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/shotgun.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
#  - type: VehicleGun
  - type: AmmoCounter

