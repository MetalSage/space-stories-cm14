      XenoPrimaryOne: [ ActionXenoCharge ]
      XenoPrimaryTwo: [ ActionXenoStomp ]
      XenoPrimaryThree: [ STActionXenoCrusherShield ]
  - type: XenoBaseCaste
  - type: Xeno
    actionIds:
    - ActionXenoRest
    - ActionXenoRegurgitate
    - ActionXenoWatch
    - ActionXenoTailStab
    - ActionXenoCharge
    - ActionXenoStomp
    - STActionXenoCrusherShield
    - ActionXenoDevolve
  - type: STCrusherShield
  - type: XenoCharge
    damage:
      types:
        Blunt: 60
        Structural: 750
  - type: STCrusherChargeTuning
  - type: XenoShield
  - type: XenoEvolution
    strains:
    - RMCXenoCrusherCharger
  - type: RMCActionOrder
    id: STXenoCrusher
