# m3 tanker
- type: entity
  parent: CMArmorM3Medium
  id: STArmorM3Tanker
  name: M3 pattern tanker armor
  description: A modified and refashioned suit of M3 Pattern armor designed to be worn by the loader of a USCM vehicle crew. While the suit is a bit more encumbering to wear with the crewman uniform, it offers the loader a degree of protection that would otherwise not be enjoyed.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/Armor/m3/tanker/jungle.rsi
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,3,1 # 2 slots
  - type: ItemCamouflage
    camouflageVariations:
      Jungle: _RMC14/Objects/Clothing/OuterClothing/Armor/m3/tanker/jungle.rsi
      Desert: _RMC14/Objects/Clothing/OuterClothing/Armor/m3/tanker/desert.rsi
      Snow: _RMC14/Objects/Clothing/OuterClothing/Armor/m3/tanker/snow.rsi
      Classic: _RMC14/Objects/Clothing/OuterClothing/Armor/m3/tanker/classic.rsi
      Urban: _RMC14/Objects/Clothing/OuterClothing/Armor/m3/tanker/urban.rsi

# M3-XL Space Stories
- type: entity
  parent: [ClothingOuterBase, BaseStorageItem, RMCBaseUniformAccessoryItemOuterClothing]
  id: STArmorVestXLBase
  abstract: true
  name: M3-XL pattern armor vest
  description: A type of body armor designed for protection against internal threats. It absorbs the impact of firearm projectiles, while retaining ease of movement. Does not protect against cuts, explosions or bio-threats. Not recommended for direct combat.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/Armor/m3/extra-light/standard/jungle.rsi
  - type: CMArmor
    melee: 0
    bullet: 5
    bio: 0
    explosionArmor: 0
  - type: Item
    size: Huge
  - type: RMCDefibrillatorBlocked
    popup: cm-defib-take-off-armor
    showOnExamine: false
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: EmitSoundOnPickup
    sound:
      collection: RMCEquipArmor
      params:
        volume: -4
  - type: EmitSoundOnDrop
    sound:
      collection: RMCEquipArmor
      params:
        volume: -4
  - type: EmitSoundOnLand
    sound:
      collection: RMCEquipArmor
      params:
        volume: -4
  - type: Clothing
    equipSound:
      path: /Audio/_RMC14/Machines/armor_equip.ogg
  - type: StoreAfterFailedInteract
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,3,1 # 2 slots
  - type: FixedItemSizeStorage
  - type: RMCStorageEjectHand
  - type: IgnoreContentsSize
    items:
      tags:
      - MRE
      - PillPacket
      - PillCanister
      - CMSurgicalCase
      - RMCSyringeCase
      - RMCBoxZipties
  - type: RMCNameItemOnVend
    item: Armor
  - type: ExplosionResistance
    damageCoefficient: 0
    worn: false
  - type: Appearance

# M3-XL MP 
- type: entity
  parent: STArmorVestXLBase
  id: STArmorVestMP
  name: M3-XL pattern MP armor vest
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/Armor/m3/extra-light/mp.rsi
  - type: ClothingRequireEquipped
    autoUnequip: true
    denyReason: rmc-armor-not-mp-jumpsuit
    whitelist:
      tags:
      - RMCUniformMP

