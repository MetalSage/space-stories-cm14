- type: entity
  parent: RMCBaseMarineArmor
  id: CMArmorMilitiaHauberk
  name: Colonial Militia Hauberk
  description: The hauberk of a colonist militia member, created from boiled leather and some modern armored plates. While not the most powerful form of armor, and primitive compared to most modern suits of armor, it gives the wearer almost perfect mobility, which suits the needs of the local colonists. It is also quick to don, easy to hide, and cheap to produce in large workshops. This one has straps interweaved with the plates, that allow the user to fire a captured smartgun, if a bit uncomfortably.
  components:
  - type: Sprite
    sprite: _Stories/Objects/Clothing/OuterClothing/Armor/colonial_militia_hauberk.rsi
  - type: Clothing
    equipDelay: 2
    unequipDelay: 2
  - type: ClothingSpeedModifier
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: CMArmor
    armor: 15
    bio: 15
    explosionArmor: 20

