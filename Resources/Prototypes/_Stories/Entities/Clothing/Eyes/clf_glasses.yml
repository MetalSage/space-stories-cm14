- type: entity
  parent: [ ClothingEyesBase ]
  id: CMGlassesNightVision
  name: TV1 night vision goggles
  description: A neat looking pair of civilian grade night vision goggles.
  components:
  - type: Sprite
    sprite: _Stories/Objects/Clothing/Eyes/Glasses/night_vision.rsi
    layers:
    - state: icon
      map: [ "icon" ]
  - type: Clothing
    sprite: _Stories/Objects/Clothing/Eyes/Glasses/night_vision.rsi
  - type: NightVisionItem
    actionId: "CMActionToggleNightVisionCLF"
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.NightVisionItemVisuals.Active:
        icon:
          True: { state: icon_on }
          False: { state: icon }
