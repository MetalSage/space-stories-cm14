      settings: short
  - type: Loadout
    prototypes: [ CMGearCLFLeaderMar40 ]
  - type: Skills
    skills:
      RMCSkillCqc: 3
      RMCSkillEndurance: 5
      RMCSkillFireman: 3
      RMCSkillConstruction: 2
      RMCSkillEngineer: 2
      RMCSkillJtac: 3
      RMCSkillLeadership: 2
      RMCSkillVehicles: 1
      RMCSkillFirearms: 1
      RMCSkillPolice: 2
      RMCSkillPowerLoader: 1
      RMCSkillMeleeWeapons: 1
  - type: MarineOrders

