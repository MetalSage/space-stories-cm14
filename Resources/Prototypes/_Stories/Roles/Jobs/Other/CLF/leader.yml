- type: entity
  parent: MarkerBase
  id: StoriesSpawnerCLFLeader
  name: CLF Leader
  suffix: Spawner, random
  components:
  - type: Sprite
    layers:
    - sprite: _Stories/Objects/Clothing/Uniforms/clf_uniform.rsi
      state: icon
  - type: ConditionalSpawner
    prototypes:
    - RandomHumanoidCLFLeaderMar40

- type: entity
  id: RandomHumanoidCLFLeaderMar40
  name: CLF leader ghost role
  suffix: Role, mar40
