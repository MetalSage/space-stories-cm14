- type: entity
  id: XenoDeployedTrap
  name: resin hole
  description: It looks like a trap for catching tallhosts.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Clickable
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        hard: false
        layer:
        - SmallMobLayer
        mask:
        - MobLayer
  - type: CollisionWake
    enabled: false
  - type: Sprite
    sprite: _Stories/Effects/xeno_boiler_trap.rsi
    drawdepth: FloorObjects
    state: trap_boiler
  - type: RMCXenoDeployedTrap
