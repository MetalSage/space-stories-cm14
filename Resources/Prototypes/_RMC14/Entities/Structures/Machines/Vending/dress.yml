      - id: CMHeadBandIntel
      # - id: No RMCMaskScarfIntel
    # Engineering
    - name: Инженерный отдел
      takeAll: RMCDresser
      jobs:
      - CMChiefEngineer
      - CMMaintTech
      - CMOrdnanceTech
      entries:
      # <Vests>
      - id: RMCHazardVestBlack
      - id: RMCHazardVestBlue
      - id: RMCHazardVest
      - id: RMCHazardVestYellow
      # </Vests>
      # <Hats>
      - id: CMHeadBeretEngineer
      - id: RMCHardhatWhite
      - id: RMCHardhatOrange
      - id: RMCHardhatBlue
      # </Hats>
      - id: RMCEngiArmband
    - name: Главный инженер
      takeAll: RMCDresser
      jobs:
      - CMChiefEngineer
      entries:
      - id: CMJumpsuitChiefEngineer
    - name: Техник по обслуживанию
      takeAll: RMCDresser
      jobs:
      - CMMaintTech
      entries:
