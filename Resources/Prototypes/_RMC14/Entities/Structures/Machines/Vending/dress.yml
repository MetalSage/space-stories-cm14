- type: entity
  parent: ColMarTechBase
  id: RMCAutomatedPersonalUniformCloset
  name: automated personal uniform closet
  description: An automated closet hooked up to a colossal storage of standard-issue dress uniform variants.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/ColMarTech/dress.rsi
  - type: CMAutomatedVendor
    sections:
    # Auxiliary
    - name: Офицер вспомогательной поддержки
      takeAll: RMCDresser
      jobs:
      - CMAuxiliarySupportOfficer
      entries:
      - id: RMCJumpsuitASOBlack
      - id: RMCJumpsuitASOBlackAlt
      - id: RMCJumpsuitASOFormal
      - id: RMCJumpsuitASOFormalAlt
      - id: RMCJumpsuitASOOperations
      - id: RMCCoatASOBlack
      - id: RMCCoatASOBlackAlt
      - id: CMCoatASO
      - id: RMCCoatASOWhite
      - id: RMCCoatASOWhiteAlt
      - id: RMCHeadCapPeakedASO
      - id: RMCHeadCapASO
      - id: RMCHeadBeretASO
      - id: CMHeadBeretTan
    - name: Офицер разведки
      takeAll: RMCDresser
      jobs:
      - CMIntelOfficer
      entries:
      - id: RMCUniformIntel
    - name: Пилот
      takeAll: RMCDresser
      jobs:
      - CMPilotDropship
      - CMPilotGunship
      entries:
      - id: CMJumpsuitPilot
    - name: Командир экипажа транспортера
      takeAll: RMCDresser
      jobs:
      - CMDropshipCrewChief
      entries:
      - id: CMJumpsuitDCC
    - name: Старший сержантский советник
      takeAll: RMCDresser
      jobs:
      - CMSeniorEnlistedAdvisor
      entries:
      - id: CMHeadCapDrill
    # Command
    - name: Офицер
      takeAll: RMCDresser
      ranks:
      - RMCRankWarrantOfficer
      - RMCRankChiefWarrantOfficer
      - RMCRankSecondLT
      - RMCRankFirstLT
      - RMCRankCaptain
      - RMCRankMajor
      - RMCRankLieutenantColonel
      - RMCRankColonel
      - RMCRankBrigadierGeneral
      - RMCRankMajorGeneral
      entries:
      - id: CMJumpsuitOperations
      - id: CMHeadCapPeakedService
      - id: CMHeadCapOfficer
      - id: RMCHeadBeret
    - name: Командующий офицер
      takeAll: RMCDresser
      jobs:
      - CMCommandingOfficer
      entries:
      - id: CMJumpsuitCOService
      - id: CMJumpsuitCOFormalBlack
      - id: CMJumpsuitCOFormalWhite
      - id: RMCJumpsuitCOUniform
      - id: RMCJumpsuitCOUniformGray
      - id: CMCoatCOBomber
      - id: CMHeadCapCO
      - id: CMHeadCapCOFormalBlack
      - id: CMHeadCapCOFormalWhite
      - id: CMHeadBeretCO
      - id: CMHeadBeretCOBlack
      - id: CMHeadBeretCOWhite
      - id: RMCHandsDeluxeMarine
      - id: CMShoesLaceupCommander
    - name: Командующий офицер (подполковник)
      takeAll: RMCDresser
      jobs:
      - CMCommandingOfficer
      ranks:
      - RMCRankLieutenantColonel
      - RMCRankColonel
      entries:
      - id: CMHeadBeretCOLtCol
    - name: Командующий офицер (полковник)
      takeAll: RMCDresser
      jobs:
      - CMCommandingOfficer
      ranks:
      - RMCRankColonel
      entries:
      - id: CMHeadBeretCOCol
    - name: Церемониальное оружие
      choices: { CMCeremonial: 1 }
      jobs:
      - CMCommandingOfficer
      entries:
      - id: RMCScabbardCeremonialFilled
        name: командирская церемониальная сабля
    - name: Исполнительный офицер
      takeAll: RMCDresser
      jobs:
      - CMCommandingOfficer
      - CMExecutiveOfficer
      entries:
      - id: CMJumpsuitXOFormal
      - id: CMCoatXOFormal
      - id: CMHeadCapPeakedFormal
      - id: RMCSunglassesBig
    - name: Цвета отряда
      jobs:
      - CMCommandingOfficer
      - CMExecutiveOfficer
      - CMAuxiliarySupportOfficer
      - CMStaffOfficer
      entries:
      - id: RMCHeadBeretSquadAlpha
      - id: RMCAlphaArmband
      - id: CMHeadBandAlpha
      - id: RMCMaskScarfAlpha
      - id: RMCHeadBeretSquadBravo
      - id: RMCBravoArmband
      - id: CMHeadBandBravo
      - id: RMCMaskScarfBravo
      - id: RMCHeadBeretSquadCharlie
      - id: RMCCharlieArmband
      - id: CMHeadBandCharlie
      - id: RMCMaskScarfCharlie
      - id: RMCHeadBeretSquadDelta
      - id: RMCDeltaArmband
