- type: entity
  parent: ColMarTechBase
  id: ColMarTechCrewSynthetic
  name: ColMarTech Synthetic Equipment Rack
  description: An automated rack hooked up to a colossal storage of various equipment. Can be accessed only by synthetic units.
  components:
  - type: AccessReader
    access:
    - [ "RMCAccessSynth" ]
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/ColMarTech/clothing.rsi
  - type: CMAutomatedVendor
    jobs:
    - RMCJobSynthetic
    sections:
    - name: Стандартное снаряжение
      takeAll: CMStandard
      entries:
      # /obj/item/coin/marine/synth
      # /obj/item/device/defibrillator/synthetic
      - id: RMCSynthResetKey
      - id: RMCHeadsetSynth
    - name: Униформа
      choices: { CMUniform: 1 }
      entries:
      - id: RMCJumpsuitSynthetic
        # mandatory: true, TODO allow vendors to mark entries as mandatory
        # /obj/item/clothing/under/rank/synthetic/old
      - id: JumpsuitMarine
      - id: CMJumpsuitMarineMedic
    - name: Разгрузка
      choices: { CMAccessories: 1 }
      entries:
      - id: CMWebbingBrown
        recommended: true
      - id: CMWebbingBlack
      - id: RMCWebbingLegPouch
      - id: RMCWebbingLegPouchBlack
      - id: RMCWebbingDropPouch
      - id: RMCWebbingDropPouchBlack
      - id: CMWebbing
      - id: RMCWebbingBlackSmall
      - id: CMWebbingHolster
      - id: RMCWebbingHolsterBlack
    - name: Ботинки
      choices: { RMCShoes: 1 }
      entries:
      - id: RMCShoesWhite
        recommended: true
      - id: CMBootsBlackFilled
    - name: Шлем
      choices: { CMHelmet: 1 }
      entries:
      - id: RMCHardhatOrange
        name: оранжевая каска
      - id: RMCHelmetWelding
      - id: CMHeadFlapCap
    - name: Костюм # Parity Vendor Fill has one for the map's camo, then still lets the synth choose from any of the options. Hence why this has so many options.
      choices: { CMSuit: 1 }
      entries:
      - id: CMArmorM3VLSynth
        recommended: true
      - id: CMArmorM3VLSynthJungle
      - id: CMArmorM3VLSynthDesert
      - id: CMArmorM3VLSynthSnow
      - id: CMArmorM3VLSynthClassic
      - id: CMArmorM3VLSynthUrban
    - name: Перчатки
      choices: { CMGloves: 1 }
      entries:
      - id: CMHandsInsulated
        recommended: true
      - id: CMHandsBlackInsulated
        recommended: true
      - id: CMHandsBlackMarine
      - id: CMHandsLatex
    - name: Рюкзак
      choices: { CMBackpack: 1 }
      entries:
      - id: RMCSmartpack
        name: рюкзак S-V42, синий
        recommended: true
      - id: RMCSmartpackBlack
        name: рюкзак S-V42, черный
      - id: RMCSmartpackGreen
        name: рюкзак S-V42, зеленый
      - id: RMCSmartpackTan
        name: рюкзак S-V42, коричневый
      - id: RMCSmartpackWhite
        name: рюкзак S-V42, белый
      - id: RMCSmartpackA1
        name: рюкзак S-V42A1, синий
      - id: RMCSmartpackA1Black
        name: рюкзак S-V42A1, черный
      - id: RMCSmartpackA1Green
        name: рюкзак S-V42A1, зеленый
      - id: RMCSmartpackA1Tan
        name: рюкзак S-V42A1, коричневый
      - id: RMCSmartpackA1White
        name: рюкзак S-V42A1, белый
    - name: Пояс
      choices: { CMBelt: 1 }
      entries:
      - id: RMCBeltUtilityGeneral
      - id: CMBeltMedicBagFilled
        name: медицинский пояс M276 (полный)
      - id: CMBeltMedicalFilled
        name: медицинский пояс M276 (полный)
      - id: CMBeltUtilityFilled
        name: пояс для инструментов M276 (полный)
    - name: Подсумки
      choices: { CMPouch: 2 }
      entries:
      - id: RMCPouchAutoinjector
      - id: RMCPouchConstruction
      - id: RMCPouchDocument
      - id: RMCPouchElectronicsFill
        name: подсумок электроники (полный)
      - id: RMCPouchFirstAidInjectors
        name: подсумок первой помощи (инъекторы)
      - id: RMCPouchFirstAidSplintsGauzeOintment
        name: подсумок первой помощи (бинт, мазь) # TODO RMC14 splints comma
      - id: RMCPouchFirstAidPills
        name: подсумок первой помощи (таблетки)
      - id: RMCPouchFlareFilled
        name: подсумок фаеров (полный)
      - id: RMCPouchGeneralLarge
      - id: RMCPouchSling
      - id: RMCPouchMedical
      - id: RMCPouchMedkit
      - id: RMCPouchReagentCanisterTricordrazineRevival
        name: канистра реагентов (возрождающая смесь - трикордразин)
#     - id: CMPressurizedReagentCanisterPouchPeridaxonRevivalMix
#       name: Pressurized Reagent Canister Pouch\n(Revival Mix - Peridaxon)
#        recommended: true
      - id: RMCPouchReagentCanisterBicaridine
        name: канистра реагентов (бикаридин)
      - id: RMCPouchReagentCanisterKelotane
        name: канистра реагентов (келотан)
      - id: RMCPouchReagentCanisterTricordrazine
        name: канистра реагентов (трикордразин)
      - id: RMCPouchReagentCanister
        name: канистра реагентов (пустая)
      - id: RMCPouchToolsFill
        name: подсумок для инструментов (полный)
      - id: RMCPouchMacheteFilled
        name: подсумок мачете (полный)
    - name: Маска
      choices: { CMMask: 1 }
      entries:
      - id: CMMaskSterile

- type: entity
  parent: ColMarTechCrewSynthetic
  id: ColMarTechCrewSyntheticColony
  name: ColMarTech Synthetic Equipment Rack
  suffix: Colony Synth Access
  components:
  - type: CMAutomatedVendor
    jobs:
