# EQUIPMENT VENDOR

- type: entity
  parent: ColMarTechBase
  id: ColMarTechCrewCombatCorrespondent
  name: ColMarTech Combat Correspondent Equipment Rack
  description: An automated rack hooked up to a colossal storage of Reporter standard-issue equipment.
  components:
  - type: AccessReader
    access:
    - [ "CMAccessPress" ]
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/ColMarTech/clothing.rsi
  - type: CMAutomatedVendor
    jobs:
    - CMCorrespondent
    sections:
    - name: Стандартное Оборудование
      takeAll: CMStandard
      entries:
      - id: RMCVendorBundleCrewCombatCorrespondent
        name: необходимый набор репортера
      - id: CMSatchel
        name: rожаная сумка
      - id: RMCCameraBroadcasting
        name: камера для телевизионной съемки
        recommended: true
    #- name: Civilian Equipment TODO - Some way to ensure only the civilian correspondent can buy this
    #  takeAll: CMStandard
    #  entries:
    #  - id: PortableFaxMachine
    #    name: Portable Press Fax Machine
    #    recommended: true
    - name: Униформа
      choices: { CMUniform: 1 }
      entries:
      - id: RMCJumpsuitCorrespondentBlack
        name: чёрная униформа
      - id: RMCJumpsuitCorrespondentOrange
        name: оранжевая униформа
      - id: RMCJumpsuitCorrespondentRed
        name: красная униформа
    - name: Броня
      choices: { CMArmor: 1 }
      entries:
      - id: CMArmorPress
        name: броня военного корреспондента
        recommended: true
      - id: RMCCoatCorrespondentBlue
        name: синий жилет
      - id: RMCHazardVestBlack
        name: чёрный жилет
      - id: RMCCoatCorrespondentBlack
        name: чёрная куртка
      - id: RMCCoatCorrespondentGreen
        name: зеленая куртка
    - name: Шлем
      choices: { CMHelmet: 1 }
      entries:
      - id: CMArmorHelmetPress
        name: шлем военного корреспондента
        recommended: true
      - id: RMCHeadCapCorrespondent
        name: кепка военного корреспондента
      - id: RMCHeadCapFedoraGrey
        name: федора
    - name: Расходники
      entries:
      #- id: /obj/item/device/camera
      #  name: Camera
      #  points: 10
      #- id: /obj/item/device/camera_film
      #  name: Camera Film
      #  points: 5
      #- id: /obj/item/device/toner
      #  name: Toner
      # points: 5
      #- id: /obj/item/storage/box/tapes
      #  name: Regulation Tapes
      #  points: 15
      - id: CMPaperBin30
        name: корзина для бумаги
        points: 10

- type: entity
  parent: CMVendorBundleRiflemanApparel
  id: RMCVendorBundleCrewCombatCorrespondent
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Tools/Light/flashlight.rsi
    state: flashlight
  - type: CMVendorBundle
    bundle:
    - RMCFlashlight
    - CMPen
    - RMCBinoculars
    - CMClipboard # notepad
    #- taperecorder
