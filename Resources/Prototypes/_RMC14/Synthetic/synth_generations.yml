    inherentStunDuration: 3
    fullProtection: true
  - type: MobThresholds
    thresholds:
      0: Alive
      399: Critical
      400: Dead
  - type: MovementSpeedModifier # Stories-Synth
    baseSprintSpeed: 4.5
    baseWalkSpeed: 2.4
  - type: ShowHealthIcons
  - type: ShowHealthBars
  - type: RMCAllowSuitStorage
  - type: RemoveComponents
    components:
    - type: HiddenAppearance

