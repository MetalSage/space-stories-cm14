    skills:
      RMCSkillCqc: 3
      RMCSkillEngineer: 4
      RMCSkillConstruction: 3
      RMCSkillFirearms: 2
      RMCSkillOverwatch: 1
      RMCSkillMedical: 3
      RMCSkillSurgery: 2
      RMCSkillResearch: 1
