- type: alert
  parent: XenoEnergyBase
  id: XenoEnergyAcider
  name: Запас кислоты
  description: Ваша накопленная кислота. Используется различными способностями. Вы можете пассивно генерировать только до 400.

- type: alert
  parent: XenoEnergyBase
  id: XenoEnergyValkyrie
  name: Ярость
  description: Ваша накопленная ярость. Используется различными способностями.

- type: alert
  parent: XenoEnergyBase
  id: XenoEnergyHealer
  name: Пожертвованное здоровье
  description: Ваше общее здоровье, пожертвованного для сестер. Если оно полное, вы воскреснете после использования жертвы.

- type: alert
  parent: XenoEnergyBase
  id: XenoEnergyShards
  name: Осколки
  description: Ваши накопленные осколки. Используются различными способностями. Чем больше осколков, тем больше брони вы получаете.
